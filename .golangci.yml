version: "2"
linters:
  # In addition to the default linters errcheck, govet, ineffassign,
  # staticcheck and unused
  enable:
    # Errors compared with == or type assertions instead of errors.Is and
    # errors.As, which miss wrapped errors
    - errorlint
    # Common style issues and simplifications
    - gocritic
    # Misspelled English words in comments and strings
    - misspell
    # Go naming and style conventions, e.g. consistent receiver names
    - revive
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
        - staticcheck
      # SA5008 disabled as kong tags are not detected correctly (multiple use of "type")
      # Staticcheck is run as library inside golangci-lint and does not support in-file
      # directives, so disable it globally on golangci-lint level
        text: 'SA5008:'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
