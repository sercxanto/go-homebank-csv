# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to a pull request cancels the checks of the previous one. Other
# runs get a group of their own (run_id), so that every commit on main is
# checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The macOS and Windows jobs are the slowest ones. They are skipped for pull
  # requests which only change files that cannot affect the build or the tests,
  # e.g. documentation. Everything not listed below counts as relevant, so new
  # kinds of files are tested on all platforms by default. Pushes to main always
  # run on all platforms.
  changes:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.filter.outputs.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Select the operating systems
      id: filter
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        relevant=true
        if [ "$EVENT" = pull_request ]; then
          relevant=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/build-and-test.yml) relevant=true ;;
              *.md | .changes/* | .changie.yaml | .markdownlint.json | LICENSE) ;;
              .devcontainer/* | .gitignore | .golangci.yml | .goreleaser.yaml) ;;
              .github/* | Taskfile.yml) ;;
              *) relevant=true ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
        fi
        if [ "$relevant" = true ]; then
          echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
        else
          echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: changes
    strategy:
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # Keep the minor version in sync with the go directive in go.mod.
        # check-latest installs the latest patch release, which contains the
        # security fixes of the standard library.
        go-version: '1.26'
        check-latest: true

    # The result does not depend on the OS. On Windows git checks the files
    # out with CRLF line endings, which go mod tidy would report as changed.
    - name: Check that go.mod and go.sum are tidy
      if: matrix.os == 'ubuntu-latest'
      run: go mod tidy -diff

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v -race -coverprofile cover.out ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      if: matrix.os == 'ubuntu-latest'
      with:
        files: ./cover.out
