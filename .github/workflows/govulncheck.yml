name: govulncheck

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # New vulnerabilities are published independently of changes to this
  # repository, so check weekly as well
  schedule:
    - cron: "17 6 * * 1"

# A new push to a pull request cancels the checks of the previous one. Other
# runs get a group of their own (run_id), so that every commit on main is
# checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          # Keep the minor version in sync with the go directive in go.mod.
          # check-latest installs the latest patch release, so that only
          # vulnerabilities which are not fixed yet are reported for the
          # standard library.
          go-version-input: '1.26'
          check-latest: true
          go-package: ./...
