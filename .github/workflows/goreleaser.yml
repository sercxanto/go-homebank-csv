# .github/workflows/release.yml
name: goreleaser

on:
  push:
    # run only semantic versioning tags
    tags:
      - "v*"

permissions:
  contents: write
  # packages: write
  # issues: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v7
        with:
          # Keep the minor version in sync with the go directive in go.mod.
          # check-latest installs the latest patch release, which contains the
          # security fixes of the standard library.
          go-version: '1.26'
          check-latest: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Any v2 release, but no unreviewed jump to a new major version
          version: '~> v2'
          args: release --clean --release-notes .changes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
