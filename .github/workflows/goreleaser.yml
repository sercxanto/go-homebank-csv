# .github/workflows/release.yml
name: goreleaser

on:
  push:
    # run only semantic versioning tags
    tags:
      - "v*"

permissions:
  contents: write
  # packages: write
  # issues: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Keep the minor version in sync with the go directive in go.mod.
          # check-latest installs the latest patch release, which contains the
          # security fixes of the standard library.
          go-version: '1.26'
          check-latest: true
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Any v2 release, but no unreviewed jump to a new major version
          version: '~> v2'
          args: release --clean --release-notes .changes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
